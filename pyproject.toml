[project]
name = "speech-lab"
version = "0.1.0"
description = "Bancada de experimentação para análise de fala em pt-BR: qual pipeline preserva o desvio de pronúncia em vez de normalizá-lo"
requires-python = ">=3.11,<3.12"

dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1",
    # persistência
    "sqlmodel>=0.0.22",
    # áudio
    "soundfile>=0.12",
    "numpy>=1.26",
    # engines locais
    "faster-whisper>=1.1",
    "torch>=2.5",
    "torchaudio>=2.5",
    "transformers>=4.46",
    # dados
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Instalados sob demanda. A ausência de qualquer um destes faz a engine
# correspondente reportar UNAVAILABLE, nunca quebrar as outras.
phonemes = ["phonemizer>=3.3"]
azure = ["azure-cognitiveservices-speech>=1.41"]
gemini = ["google-genai>=0.3"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
package = false
